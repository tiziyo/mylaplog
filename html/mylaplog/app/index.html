<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/v1/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLapLog - Redirecting...</title>
  <link rel="canonical" href="https://mylaplog.com/v1/">
  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var target = '/v1/' + hash;
      if (search) {
        target += (target.indexOf('?') === -1 ? '?' : '&') + search.slice(1);
      }
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      background: #06090e;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .redirect-card {
      padding: 2.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.6);
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.25rem;
      color: #f1f5f9;
      margin: 0 0 0.5rem 0;
    }
    p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }
    a {
      color: #00f2fe;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1>MyLapLog</h1>
    <p>MyLapLog v1 서비스로 이동 중입니다...</p>
    <p><small>자동으로 이동하지 않으면 <a href="/v1/">여기를 클릭</a>하세요.</small></p>
  </div>
</body>
</html>
